<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>0xForge · Agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="crumbs">
        <span class="logo">◆</span>
        <span>Agents</span>
        <span class="sep">/</span>
        <span class="muted">Portfolio</span>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">4 agents online</span></div>
    </header>

    <main class="grid">
      <section class="left">
        <div class="balance-card">
          <div class="balance-head">
            <span class="label">0XFORGE · AGENTS</span>
            <span class="live"><span class="pulse"></span>LIVE</span>
            <span class="label to-right">Balance</span>
          </div>
          <div class="balance" id="balance">$7.00</div>
          <div class="profit" id="profit">+$0.00 profit · from $7</div>
          <div class="stats">
            <span class="mult" id="mult">1.0x</span>
            <span id="trades-meta">0 trades · 0% win</span>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Profit by agent</div>
          <div class="bar" id="agent-bar"></div>
          <div class="agents" id="agent-legend"></div>
        </div>

        <div class="panel activity">
          <div class="panel-title">Activity</div>
          <ul class="log" id="log"></ul>
        </div>
      </section>

      <section class="right">
        <div class="panel trades-panel">
          <div class="trades-head">
            <span class="panel-title">Closed trades</span>
            <span class="muted small" id="trades-total">0 total</span>
          </div>
          <div class="trades" id="trades"></div>
        </div>
        <button class="withdraw" id="withdraw">Withdraw <span id="withdraw-amt">$7.00</span></button>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="src/data.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
